name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      repository:
        description: "pypi or testpypi"
        default: "testpypi"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.repository || 'pypi' }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      # A release uploaded by hand (twine) is already there; uploading it again
      # would fail the run for no reason.
      - name: is this version already on PyPI?
        id: pypi
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/ai-epub-translator/${GITHUB_REF_NAME#v}/json")
          if [ "$code" = 200 ]; then echo "published=yes" >> "$GITHUB_OUTPUT"
          else echo "published=no" >> "$GITHUB_OUTPUT"; fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.pypi.outputs.published == 'no'
        with:
          repository-url: ${{ github.event.inputs.repository == 'testpypi' && 'https://test.pypi.org/legacy/' || '' }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true

  # The formula carries the SHA-256 of the sdist on PyPI, so it can only be
  # written once the upload is done — after the tag, never with it.
  homebrew:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: regenerate the formula from the published sdist
        run: python3 tools/brew_formula.py --wait 600
      - name: commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ai-epub-translator.rb
          git diff --cached --quiet || git commit -m "brew: ai-epub-translator ${GITHUB_REF_NAME#v}"
          git push origin main
